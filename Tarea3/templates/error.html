{% extends "base.html" %}
{% block titulo %}Error {{ codigo }}{% endblock %}

{% block contenido %}
<div class="tarjeta tarjeta--estrecha pagina-error">
    <p class="pagina-error__codigo">{{ codigo }}</p>
    <h1>{{ 'Acceso restringido' if codigo == 403 else 'No se pudo completar la solicitud' }}</h1>
    <p>{{ mensaje }}</p>
    <div class="acciones-form">
        <a href="javascript:history.back()" class="btn btn--secundario">← Regresar</a>
        <a href="{{ url_for('listar_empleados') }}" class="btn">Ir al inicio</a>
    </div>
</div>
{% endblock %}
