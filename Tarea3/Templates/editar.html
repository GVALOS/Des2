<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Empleado</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Editar Expediente de Empleado</h1>
        
        {% if error %}
        <div class="alert-error" style="color: red; margin-bottom: 15px; font-weight: bold;">
            {{ error }}
        </div>
        {% endif %}
        
        <form method="POST" action="/empleados/editar/{{ empleado.id }}">
            <div class="form-group">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre" value="{{ empleado.nombre }}" placeholder="Ej. Juan Pérez" required>
            </div>
            
            <div class="form-group">
                <label for="dui">Número de DUI:</label>
                <input type="text" id="dui" name="dui" value="{{ empleado.dui }}" placeholder="00000000-0" required>
            </div>
            
            <div class="form-group">
                <label for="perfil">Perfil Profesional:</label>
                <select id="perfil" name="perfil" required>
                    <option value="" disabled>Seleccione un perfil</option>
                    <option value="medico" {% if empleado.perfil == 'medico' %}selected{% endif %}>Médico</option>
                    <option value="administrativo" {% if empleado.perfil == 'administrativo' %}selected{% endif %}>Administrativo</option>
                    <option value="enfermeria" {% if empleado.perfil == 'enfermeria' %}selected{% endif %}>Enfermería</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="observaciones">Observaciones:</label>
                <textarea id="observaciones" name="observaciones" placeholder="Comentarios adicionales...">{{ empleado.observaciones or '' }}</textarea>
            </div>
            
            <div class="form-actions" style="margin-top: 20px;">
                <button type="submit">Actualizar Empleado</button>
                <a href="/empleados" style="margin-left: 10px;">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
